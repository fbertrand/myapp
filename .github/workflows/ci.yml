# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  IMAGE: ghcr.io/${{ github.repository_owner }}/myapp

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GO_VERSION: "1.26"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ─── Lint ──────────────────────────────────────────────
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      # ─── Tests ─────────────────────────────────────────────
      - name: Tests
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: coverage
          path: coverage.out

  # ─── Build & Push Docker ────────────────────────────────────
  docker:
    name: Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write # pour pousser sur ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token automatique, pas de secret à configurer

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha # cache layer Docker dans GitHub Actions
          cache-to: type=gha,mode=max
